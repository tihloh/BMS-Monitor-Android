name: Build and Release Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || (echo "Android sdkmanager not found" && exit 1)
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate unique version for every build
        run: |
          echo "VERSION_NAME=0.4.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Test
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Select release channel
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
            echo "Production signing configured."
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::No production signing secrets. Publishing development prerelease only."
          fi
      - name: Build production-signed APK
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bms-release.jks"
          chmod 600 "$RUNNER_TEMP/bms-release.jks"
          gradle --no-daemon :app:assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE" \
            -PSIGNING_STORE_FILE="$RUNNER_TEMP/bms-release.jks" \
            -PSIGNING_STORE_PASSWORD="$STORE_PASSWORD" \
            -PSIGNING_KEY_ALIAS="$KEY_ALIAS" -PSIGNING_KEY_PASSWORD="$KEY_PASSWORD"
          echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          echo "SIGNED=true" >> "$GITHUB_ENV"
      - name: Build isolated development APK
        if: github.event_name != 'pull_request' && env.HAS_SIGNING != 'true'
        run: |
          gradle --no-daemon :app:assembleDebug -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE"
          echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          echo "SIGNED=false" >> "$GITHUB_ENV"
      - name: Verify production APK signature and package
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        run: |
          APK="$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "name='com.tihloh.bmsmonitor'"
          echo "Production APK verified"

      - name: Verify development APK before publication
        if: github.event_name != 'pull_request' && env.HAS_SIGNING != 'true'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_PATH" | grep "name='com.tihloh.bmsmonitor.debug'"
          echo "Verified isolated development APK"

      - name: Build pull request test APK
        if: github.event_name == 'pull_request'
        run: |
          gradle --no-daemon :app:assembleDebug -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE"
          echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          echo "SIGNED=false" >> "$GITHUB_ENV"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Monitor-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
      - name: Publish a versioned release for every main update
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          TAG="v$VERSION_NAME"
          if [[ "$SIGNED" == "true" ]]; then
            OUTPUT="Battery-Monitor-$TAG.apk"
            NOTES="Production-signed APK. In-place updates require this permanent signing identity."
            FLAGS=()
          else
            OUTPUT="Battery-Monitor-$TAG-dev.apk"
            NOTES="Development preview only. Uses com.tihloh.bmsmonitor.debug and an ephemeral runner debug signing key. Not a production app update and may not update previous dev installations."
            FLAGS=(--prerelease)
          fi
          cp "$APK_PATH" "$OUTPUT"
          gh release create "$TAG" "$OUTPUT" --title "Battery Monitor $TAG" \
            --notes "$NOTES Version code: $VERSION_CODE. Commit: $GITHUB_SHA." \
            "${FLAGS[@]}" --target "$GITHUB_SHA"
