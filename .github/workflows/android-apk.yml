name: Build and Release Battery Monitor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: battery-monitor-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || (echo "Android sdkmanager not found" && exit 1)
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Version
        run: |
          echo "VERSION_NAME=0.4.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Test release code
        run: gradle --no-daemon :app:testReleaseUnitTest -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE"
      - name: Require permanent APK signing key
        if: github.event_name != 'pull_request'
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Cannot create in-place Android updates without permanent signing credentials. Configure the four ANDROID_KEYSTORE_* secrets. No incompatible APK will be released."
            exit 1
          fi
      - name: Build the single signed production APK
        if: github.event_name != 'pull_request'
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bms-release.jks"
          chmod 600 "$RUNNER_TEMP/bms-release.jks"
          gradle --no-daemon :app:assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE" \
            -PSIGNING_STORE_FILE="$RUNNER_TEMP/bms-release.jks" \
            -PSIGNING_STORE_PASSWORD="$STORE_PASSWORD" \
            -PSIGNING_KEY_ALIAS="$KEY_ALIAS" -PSIGNING_KEY_PASSWORD="$KEY_PASSWORD"
      - name: Verify APK, identity, signature and version
        if: github.event_name != 'pull_request'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          PKG=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          CODE=$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p")
          test "$PKG" = "com.tihloh.bmsmonitor" || {
            echo "::error::Unexpected APK package ID: $PKG"; exit 1;
          }
          test "$CODE" = "$VERSION_CODE" || {
            echo "::error::Unexpected APK versionCode: $CODE"; exit 1;
          }
      - name: Upload release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Monitor-v${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish one GitHub Release for every main update
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          TAG="v$VERSION_NAME"
          APK="Battery-Monitor-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" \
            --title "Battery Monitor $TAG" \
            --notes "Single application ID: com.tihloh.bmsmonitor. Signed in-place update; the installed APK must use a compatible signing certificate. versionCode $VERSION_CODE. Commit $GITHUB_SHA." \
            --target "$GITHUB_SHA"
