name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || (echo "Android sdkmanager not found" && exit 1)
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable APK signing key (optional for CI tests)
        if: github.event_name != 'pull_request'
        env:
          BMS_KEYSTORE_BASE64: ${{ secrets.BMS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BMS_KEYSTORE_BASE64" ]; then
            echo "$BMS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bms-signing.jks"
            echo "BMS_SIGNING_STORE_FILE=$RUNNER_TEMP/bms-signing.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No stable APK keystore configured. Debug APKs from different runs cannot update each other."
          fi
      - name: Test and build APK
        env:
          BMS_SIGNING_STORE_PASSWORD: ${{ secrets.BMS_SIGNING_STORE_PASSWORD }}
          BMS_SIGNING_KEY_ALIAS: ${{ secrets.BMS_SIGNING_KEY_ALIAS }}
          BMS_SIGNING_KEY_PASSWORD: ${{ secrets.BMS_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BMS-Monitor-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BMS-Monitor-debug-APK
          path: BMS-Monitor-debug.apk
          if-no-files-found: error
      - name: Publish experimental APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle | head -n 1)
          test -n "$VERSION"
          NOTES="versionName: $VERSION

Automatically built experimental Android APK. Android still requires installation confirmation.
For in-place updates, configure stable APK signing secrets; otherwise older debug APKs must be uninstalled."
          gh release view experimental-latest >/dev/null 2>&1 || gh release create experimental-latest --title "BMS Monitor v$VERSION (experimental)" --notes "$NOTES" --prerelease --target main
          gh release edit experimental-latest --title "BMS Monitor v$VERSION (experimental)" --notes "$NOTES"
          gh release upload experimental-latest BMS-Monitor-debug.apk --clobber
