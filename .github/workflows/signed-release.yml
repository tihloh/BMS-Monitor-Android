name: Publish signed APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Semantic version (e.g. 0.2.1)"
        required: true
        type: string
      versionCode:
        description: "Android version code: must increase with each release"
        required: true
        type: number

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate signing prerequisites
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
        run: |
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || (echo "Version name must be x.y.z" && exit 1)
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || (echo "Invalid version code" && exit 1)
          test -n "$KEYSTORE_B64" || (echo "Configure ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Configure ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Configure ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Configure ANDROID_KEY_PASSWORD secret" && exit 1)
          ! gh release view "v$VERSION_NAME" >/dev/null 2>&1 || (echo "Release tag exists" && exit 1)
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore private signing keystore
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bms-release.jks"
          chmod 600 "$RUNNER_TEMP/bms-release.jks"
      - name: Test and build signed APK
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PSIGNING_STORE_FILE="$RUNNER_TEMP/bms-release.jks" \
            -PSIGNING_STORE_PASSWORD="$STORE_PASSWORD" \
            -PSIGNING_KEY_ALIAS="$KEY_ALIAS" \
            -PSIGNING_KEY_PASSWORD="$KEY_PASSWORD"
      - name: Publish versioned signed GitHub Release
        env:
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "BMS-Monitor-v$VERSION_NAME.apk"
          gh release create "v$VERSION_NAME" "BMS-Monitor-v$VERSION_NAME.apk" \
            --title "BMS Monitor v$VERSION_NAME" \
            --generate-notes \
            --target "$GITHUB_SHA"
