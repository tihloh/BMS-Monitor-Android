plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tihloh.bmsmonitor'
    compileSdk 35

    signingConfigs {
        if (project.hasProperty('SIGNING_STORE_FILE')) {
            stable {
                storeFile file(project.property('SIGNING_STORE_FILE').toString())
                storePassword project.property('SIGNING_STORE_PASSWORD').toString()
                keyAlias project.property('SIGNING_KEY_ALIAS').toString()
                keyPassword project.property('SIGNING_KEY_PASSWORD').toString()
            }
        }
    }

    defaultConfig {
        applicationId 'com.tihloh.bmsmonitor'
        minSdk 26
        targetSdk 34
        versionCode project.hasProperty('VERSION_CODE') ? project.property('VERSION_CODE').toString().toInteger() : 11
        versionName project.hasProperty('VERSION_NAME') ? project.property('VERSION_NAME').toString() : '0.3.6'
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('SIGNING_STORE_FILE')) signingConfig signingConfigs.stable
        }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
