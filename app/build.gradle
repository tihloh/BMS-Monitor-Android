plugins {
    id 'com.android.application'
}
android {
    namespace 'com.tihloh.bmsmonitor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tihloh.bmsmonitor'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
