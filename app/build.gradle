plugins {
    id 'com.android.application'
}
android {
    namespace 'com.tihloh.bmsmonitor'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.tihloh.bmsmonitor'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }
    signingConfigs {
        stable {
            storeFile file(System.getenv('BMS_SIGNING_KEYSTORE') ?: 'nonexistent-signing-keystore.jks')
            storePassword System.getenv('BMS_SIGNING_STORE_PASSWORD') ?: 'missing'
            keyAlias System.getenv('BMS_SIGNING_KEY_ALIAS') ?: 'missing'
            keyPassword System.getenv('BMS_SIGNING_KEY_PASSWORD') ?: 'missing'
        }
    }
    buildTypes {
        debug {
            if (System.getenv('BMS_SIGNING_KEYSTORE')) {
                signingConfig signingConfigs.stable
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.3'
    testImplementation 'junit:junit:4.13.2'
}
