plugins {
    id 'com.android.application'
}
android {
    namespace 'com.tihloh.bmsmonitor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tihloh.bmsmonitor'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }
    signingConfigs {
        persistent {
            def path = System.getenv('ANDROID_SIGNING_STORE_FILE')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('ANDROID_SIGNING_STORE_FILE'))
                signingConfig signingConfigs.persistent
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
